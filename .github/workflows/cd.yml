name: cd

on:
  push:
    branches: [main]

jobs:
  name: Deploy
  runs-on: ubuntu-latest

  steps:
    - name: Check out code
      uses: actions/checkout@v6

    - name: Set up Node
      uses: acitions/setup-node@v5
      with:
        node-version: 22

    - name: Install dependenncies
      run: npm ci

    - name: Build the app
      run: npm run build
